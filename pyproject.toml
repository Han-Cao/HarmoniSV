[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HarmoniSV"
version = "0.1.1"
description = "A toolkit to harmonize and filter structural variations across methods and samples."
authors = [
    { name = "Han Cao", email = "hcaoad@connect.ust.hk" },
]
dependencies = [
    "pysam",
    "pandas",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "pyranges"
]
requires-python = ">=3.8"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = {file = "LICENSE"}

[project.optional-dependencies]
dev = [
    "mkdocs"
]

[project.scripts]
harmonisv = "harmoniSV.cli:main"

[project.urls]
Homepage = "https://github.com/Han-Cao/HarmoniSV"
Issues = "https://github.com/Han-Cao/HarmoniSV/issues"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["test*", "docs*", "site*", "plans*", "mkdocs.yml"]